name: CI

# This package is a library, and each of its tests runs in process. So CI runs
# the one unit suite of the root `Package.swift`, and there is no integration
# package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
